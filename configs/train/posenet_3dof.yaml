experiment:
  name: posenet_3dof
  seed: 20260608

data:
  dataset_config: configs/dataset/kitti.yaml
  smoke_sequences: ["00"]
  train_sequences: ["00", "01", "02", "03", "04", "05", "06"]
  val_sequences: ["07", "08"]
  test_sequences: ["09", "10"]

bev:
  x_range_m: [0.0, 70.0]
  y_range_m: [-35.0, 35.0]
  resolution_m: 0.5
  channels: ["density", "max_height", "mean_height", "intensity"]

pose:
  target_dof: 3
  label_frame: previous_lidar
  pose_norm:
    source_split: train
    strategy: train_split_mean_std
    label_order: ["dx_m", "dy_m", "yaw_rad"]
    sequences: ["00", "01", "02", "03", "04", "05", "06"]
    count: 15230
    mean: [1.0261731147766113, -0.0002028998569585383, -0.00004391550100990571]
    std: [0.469381719827652, 0.02020873874425888, 0.017427677288651466]
    min: [-0.015585881657898426, -0.245121568441391, -0.0743253156542778]
    max: [2.738995313644409, 0.31214556097984314, 0.08329317718744278]
    generated_by: scripts/preview_pose_labels.py

model:
  name: PoseNet3DoF
  hidden_channels: 32
  dropout: 0.0

training:
  batch_size: 4
  epochs: 1
  optimizer: AdamW
  learning_rate: 0.001
  loss_weights: [1.0, 1.0, 1.0]
  amp: true
