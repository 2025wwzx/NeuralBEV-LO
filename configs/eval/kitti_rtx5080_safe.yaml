experiment:
  name: kitti_rtx5080_safe
  seed: 20260608

data:
  dataset_config: configs/dataset/kitti.yaml
  sequence: "07"

bev:
  x_range_m: [0.0, 70.0]
  y_range_m: [-35.0, 35.0]
  resolution_m: 0.25
  channels: ["density", "max_height", "mean_height", "intensity"]

bev_memory:
  policy: decay
  alpha: 0.9
  temporal_window: 5

metrics:
  occupancy_threshold: 0.1
  selected_channels: ["density"]
  flicker_window: 5

runtime:
  device: cuda
  amp: true
  batch_size: 2
  max_frames: 20
  num_workers: 2
  profile_runtime: true
  notes: "OOM-conservative RTX 5080 path; lower batch size before lowering resolution."

filters:
  z_range_m: [-3.0, 2.0]
  distance_range_m: [0.0, 70.0]
